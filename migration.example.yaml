# 通用数据迁移与核对工具 - 配置示例
#
# 两个安全默认值请务必知悉：
#   1) 条件迁移只做“复制 + 核对”，源表不会被删除；要删除必须显式加 -purge（别名 -purge-source）。
#   2) 核对只要有一项不通过，就会产出结果文件并以非零退出码结束，不会自动进入删除。
#
# condition 会被直接拼进 SQL 的 WHERE 子句，只能填运维/开发自己编写的可信条件，
# 绝不能把外部输入（页面参数、用户表单）拼进来，否则存在 SQL 注入风险。

database:
  # 数据源名称：账号:密码@tcp(主机:端口)/库名?参数
  # 工具启动时会校验数据库是否开启严格模式（sql_mode 含 STRICT_*）。
  # 非严格模式下超长字符串会被静默截断，核对仍可能显示通过，因此不满足会直接拒绝运行。
  dsn: "user:pass@tcp(127.0.0.1:3306)/appdb?parseTime=true&charset=utf8mb4&loc=Local"
  max_open_conns: 20          # 最大打开连接数
  max_idle_conns: 10          # 最大空闲连接数
  conn_max_life_seconds: 3600 # 连接最大生存秒数
  lock_wait_timeout_seconds: 30 # 改表操作的元数据锁等待超时（秒）
  # 严格模式检查策略：
  #   require（默认）：不满足直接拒绝执行，最安全；
  #   warn：只告警并在报告里留一条降级说明，适用于目标库由 DBA 统一管控、不允许改会话变量的场景；
  #   off：完全跳过检查，风险自担。
  # 注意 warn/off 下超长字符串仍可能被静默截断，核对结论不具备严格模式下的可信度。
  strict_mode: require

output:
  dir: ./migration-reports       # 核对结果、字段差异、删除清单、合并清单输出目录

checkpoint:
  dir: ./migration-checkpoints   # 断点续跑进度目录；同时存放迁移前基线 .baseline.<表>.<模式>.json
                                 # 基线内含抽样行的原始字段值，文件权限为 0600，请按业务数据管理

tables:
- name: orders
  mode: full_table               # full_table: 整表原子改名；conditional: 按条件分批
  history_suffix: "_history"     # 历史表名后缀
  key_column: id                 # 整数主键，抽样与分批游标依赖它
  overwrite_history: false       # full_table 下历史表已存在时是否覆盖
  retention_days: 365            # 历史表保留天数（生命周期管理用）
  verify:
    # row_count 不填即为开启。显式写 false 才会关闭；
    # 即使配置了求和/抽样等其他核对项，记录数比对也不会被跳过。
    row_count: true
    numeric_sum_fields: [amount, fee]   # 求和核对字段，必须是数值类型，否则启动即报错
    nonempty_fields: [amount]           # 非空数量比对字段
    nonempty_count: true                # 开启非空数量比对
    min_max_fields: [amount, created_at] # 最值比对字段
    min_max: true                        # 开启最值比对
    # 抽样：一次顺序扫描主键索引，用蓄水池抽样取 rounds*size 条，再切成 rounds 轮。
    # 优点是无偏（每行入选概率相等）且成本可预测；代价是每张表多一次索引扫描。
    # 大表上建议 rounds*size 控制在几百到几千，sample_rounds: 0 可完全关闭抽样。
    sample_rounds: 3             # 随机抽样轮数
    sample_size: 100             # 每轮抽样条数
    abs_tolerance: 0.000001      # 浮点绝对容差；整数与定点小数始终零容差
    rel_tolerance: 0.000000001   # 浮点相对容差
    # sum_tolerance: 0.000001    # 兼容旧配置的绝对容差写法

- name: user_events
  mode: conditional
  condition: "created_at < '2024-01-01 00:00:00'"  # 直接拼接的 WHERE 条件，只能用可信内容
  history_suffix: "_archive"
  history_timestamp: true        # 历史表名带批次时间戳，默认 true，避免旧数据混入核对
  key_column: id
  batch_size: 2000               # 每批迁移行数，千万级建议 2000~5000
  retention_days: 180
  verify:
    row_count: true
    numeric_sum_fields: [duration_ms]
    sample_rounds: 5
    sample_size: 50
    abs_tolerance: 0.000001
    rel_tolerance: 0.000000001
    # 复制前后比对源表轻量指纹（记录数/求和/非空数/最值），发现复制窗口内的业务写入。
    # 默认 true。检测到变化会记一条失败项，提示历史表不是源表的完整快照。
    # 若业务在迁移窗口内本来就持续写入、且已确认这些写入不需要归档，可显式设为 false。
    detect_source_drift: true
