database:
  dsn: "user:pass@tcp(127.0.0.1:3306)/appdb?parseTime=true&charset=utf8mb4&loc=Local"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_life_seconds: 3600

tables:
- name: orders
  mode: full_table
  history_suffix: "_history"
  key_column: id
  overwrite_history: false
  verify:
      row_count: true
      sample_rounds: 3
      sample_size: 100
      numeric_sum_fields: [amount, fee]
      sum_tolerance: 0.000001

- name: user_events
  mode: conditional
  condition: "created_at < '2024-01-01 00:00:00'"
  history_suffix: "_archive"
  key_column: id
  batch_size: 2000
  verify:
      row_count: true
      sample_rounds: 5
      sample_size: 50
      numeric_sum_fields: [duration_ms]
      sum_tolerance: 0.000001
